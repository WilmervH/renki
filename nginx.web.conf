# http-context helpers for the optional /api proxy (deploy/web/40-renki-api-proxy.sh).
# Harmless when the proxy isn't configured.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# $uri, not $request: the daemon's WebSocket authenticates with ?token=, which
# must not end up in access logs.
log_format renki_noargs '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                        '$status $body_bytes_sent "$http_user_agent"';

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # /api/ -> daemon, generated at container start only when
  # RENKI_DAEMON_UPSTREAM is set (the Kubernetes deployment). An empty glob is
  # fine for nginx, so the static-only setups need nothing here.
  include /etc/nginx/renki/*.conf;

  # Client-side routes (e.g. /stats) aren't real files — fall back to the SPA
  # shell so direct navigation and refreshes work, not just in-app nav.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
