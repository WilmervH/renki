{{- if not .Values.existingSecret }}
{{- /*
  Only what the operator chose. With auth.token empty the daemon mints its own
  token on first boot and keeps it on the data volume (/data/auth-token), so
  the token is stable across upgrades, reinstalls and GitOps re-renders —
  nothing here is random.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "renki.secretName" . }}
  labels:
    {{- include "renki.labels" . | nindent 4 }}
type: Opaque
data:
  {{- with .Values.auth.token }}
  authToken: {{ . | trim | b64enc | quote }}
  {{- end }}
  {{- with .Values.claude.oauthToken }}
  claudeOauthToken: {{ . | trim | b64enc | quote }}
  {{- end }}
  {{- with .Values.github.token }}
  githubToken: {{ . | trim | b64enc | quote }}
  {{- end }}
{{- end }}
