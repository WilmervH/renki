{{- if .Values.ingress.enabled }}
{{- $ing := .Values.ingress }}
# One host, one path: the web Service serves the app and proxies /api to the
# daemon itself, so no controller-specific rewrite or WebSocket annotations
# are needed here.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "renki.fullname" . }}
  labels:
    {{- include "renki.labels" . | nindent 4 }}
  {{- with $ing.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $ing.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if $ing.tls.enabled }}
  tls:
    - hosts:
        - {{ $ing.host | quote }}
      secretName: {{ $ing.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ $ing.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "renki.webName" . }}
                port:
                  name: http
{{- end }}
